name: Run Migrations (manual)
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente (homolog|prod)'
        required: true
        default: 'homolog'
        type: choice
        options: [homolog, prod]

jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'
      - name: Configure AWS credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        run: |
          mkdir -p ~/.aws
          cat > ~/.aws/credentials << EOF
          [default]
          aws_access_key_id=${AWS_ACCESS_KEY_ID}
          aws_secret_access_key=${AWS_SECRET_ACCESS_KEY}
          aws_session_token=${AWS_SESSION_TOKEN}
          EOF

      - name: Run migrations script
        run: |
          chmod +x migrations/run-migrations.sh
          ./migrations/run-migrations.sh ${{ inputs.environment }} ../oficina-mecanica-api
