name: Run Database Migrations

on:
  workflow_dispatch:  # Execução manual
    inputs:
      environment:
        description: 'Ambiente para aplicar migrations'
        required: true
        default: 'homolog'
        type: choice
        options:
          - homolog
          - prod
  push:
    paths:
      - 'migrations/**'  # Roda quando mudar as migrations
      - 'migrations/run-migrations.sh'
    branches:
      - main
      - master
      - develop

jobs:
  migrations:
    name: Run Migrations
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Checkout API repository
        uses: actions/checkout@v4
        with:
          # Ajuste para o nome real da org/repo caso seja diferente
          repository: Tech-Challenge-Oficina-Mecanica-SOAT/oficina-mecanica-api
          path: ../oficina-mecanica-api
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore dependencies
        run: |
          cd ../oficina-mecanica-api
          dotnet restore src/OficinaMecanica.Infrastructure/OficinaMecanica.Infrastructure.csproj

      - name: Run migrations
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'homolog' }}
        run: |
          chmod +x migrations/run-migrations.sh
          ./migrations/run-migrations.sh $ENVIRONMENT ../oficina-mecanica-api

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `❌ **Falha nas migrations!** 
            
            Ambiente: ${{ github.event.inputs.environment || 'homolog' }}
            
            Verifique os logs para mais detalhes.`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request?.number || 1,
              body: message
            });