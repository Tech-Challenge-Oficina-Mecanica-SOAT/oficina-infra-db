name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: AI Code Review
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const MAX_DIFF_LENGTH = 12000;

            // Busca os arquivos alterados no PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const diffContent = files
              .filter(f => f.patch && f.status !== 'removed')
              .map(f => `### ${f.filename}\n\`\`\`diff\n${f.patch}\n\`\`\``)
              .join('\n\n');

            if (!diffContent.trim()) {
              console.log('Nenhuma alteração de código para revisar.');
              return;
            }

            console.log(`📝 Diff gerado com ${diffContent.length} caracteres`);

            const truncatedDiff = diffContent.length > MAX_DIFF_LENGTH
              ? diffContent.slice(0, MAX_DIFF_LENGTH) + '\n\n*(diff truncado por tamanho)*'
              : diffContent;

            console.log('🤖 Enviando para revisão via Google Gemini...');

            // System prompt para o Gemini
            const systemPrompt = `Você é um revisor de código experiente em Terraform, AWS e infraestrutura como código (IaC). Revise o diff do PR abaixo e forneça feedback construtivo em Português (Brasil).

            Regras obrigatórias:
            - Cite APENAS os tópicos onde houver problemas reais.
            - NÃO escreva frases do tipo "não se aplica" ou "nenhum problema encontrado neste tópico".
            - Se não houver NENHUM problema, responda apenas com: "✅ Esse PR não contém nenhum ponto de atenção relevante. Ótima implementação!"
            - Seja direto e objetivo.

            Tópicos a avaliar (somente se houver problemas):

            1. Segurança (AWS)
            2. Boas práticas de Terraform
            3. Consistência com a arquitetura do projeto
            4. Restrições do ambiente AWS Academy
            5. Possíveis bugs

            Revise este pull request:

            ${truncatedDiff}`;

            // Chama a API do Google Gemini
            const response = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${process.env.GEMINI_API_KEY}`,
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                  contents: [{
                    parts: [{
                      text: systemPrompt
                    }]
                  }],
                  generationConfig: {
                    temperature: 0.3,
                    maxOutputTokens: 1500,
                  }
                })
              }
            );

            if (!response.ok) {
              const errorText = await response.text();
              
              // Tratamento específico para erros do Gemini
              if (response.status === 403) {
                core.setFailed(`❌ Erro de permissão (403): Verifique se sua chave API do Gemini é válida e tem permissões.\nDetalhes: ${errorText}`);
              } else if (response.status === 429) {
                core.setFailed(`❌ Rate limit excedido (429): Você atingiu o limite de requisições do Gemini.\nDetalhes: ${errorText}`);
              } else {
                core.setFailed(`❌ Erro na API do Google Gemini: ${response.status} - ${errorText}`);
              }
              return;
            }

            const data = await response.json();
            
            // Extrai o texto da resposta do Gemini
            const review = data.candidates?.[0]?.content?.parts?.[0]?.text;

            if (!review) {
              core.warning('⚠️ Nenhuma revisão foi gerada pela IA.');
              return;
            }

            console.log('✅ Revisão gerada com sucesso!');

            // Remove comentários anteriores deste bot
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            let deletedCount = 0;
            for (const comment of comments) {
              if (comment.body?.startsWith('## 🤖 AI Code Review')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
                deletedCount++;
              }
            }

            if (deletedCount > 0) {
              console.log(`🗑️ Removidos ${deletedCount} comentários anteriores`);
            }

            // Posta o novo comentário de revisão
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 AI Code Review\n\n${review}\n\n---\n*Revisão gerada automaticamente via Google Gemini (gemini-3.6-flash) — não substitui a revisão humana.*`,
            });

            console.log('✅ Comentário de revisão postado com sucesso!');