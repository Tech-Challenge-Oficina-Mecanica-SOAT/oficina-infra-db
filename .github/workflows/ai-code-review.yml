name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      # models: read  # Pode não ser necessário

    steps:
      - name: AI Code Review
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const MAX_DIFF_LENGTH = 12000;

            const token = process.env.GH_TOKEN;
            if (!token) {
              core.setFailed('❌ GH_TOKEN não está configurado.');
              return;
            }

            console.log('🔍 Buscando arquivos alterados no PR...');

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const diffContent = files
              .filter(f => f.patch && f.status !== 'removed')
              .map(f => `### ${f.filename}\n\`\`\`diff\n${f.patch}\n\`\`\``)
              .join('\n\n');

            if (!diffContent.trim()) {
              console.log('ℹ️ Nenhuma alteração de código para revisar.');
              return;
            }

            console.log(`📝 Diff gerado com ${diffContent.length} caracteres`);

            const truncatedDiff = diffContent.length > MAX_DIFF_LENGTH
              ? diffContent.slice(0, MAX_DIFF_LENGTH) + '\n\n*(diff truncado por tamanho)*'
              : diffContent;

            console.log('🤖 Enviando para revisão via GitHub Models...');

            const systemPrompt = `Você é um revisor de código experiente em Terraform, AWS e infraestrutura como código (IaC). Revise o diff do PR abaixo e forneça feedback construtivo em Português (Brasil).

            Regras obrigatórias:
            - Cite APENAS os tópicos onde houver problemas reais.
            - NÃO escreva frases do tipo "não se aplica" ou "nenhum problema encontrado neste tópico".
            - Se não houver NENHUM problema, responda apenas: "✅ Esse PR não contém nenhum ponto de atenção relevante. Ótima implementação!"
            - Seja direto e objetivo.

            Tópicos a avaliar (somente se houver problemas):

            1. Segurança (AWS)
            2. Boas práticas de Terraform
            3. Consistência com a arquitetura do projeto
            4. Restrições do ambiente AWS Academy
            5. Possíveis bugs`;

            // Usando a API de Models do GitHub
            const response = await fetch('https://api.github.com/models/chat/completions', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`,
                'Accept': 'application/vnd.github.v3+json'
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [
                  {
                    role: 'system',
                    content: systemPrompt
                  },
                  {
                    role: 'user',
                    content: `Revise este pull request:\n\n${truncatedDiff}`
                  }
                ],
                max_tokens: 1500,
                temperature: 0.3
              })
            });

            if (!response.ok) {
              const errorText = await response.text();
              
              if (response.status === 401) {
                core.setFailed(`❌ Erro de autenticação (401): Token inválido. Verifique se o GITHUB_TOKEN tem as permissões corretas.\nDetalhes: ${errorText}`);
              } else if (response.status === 404) {
                core.setFailed(`❌ Endpoint não encontrado (404). Verifique se o GitHub Models está habilitado para este repositório.\nDetalhes: ${errorText}`);
              } else {
                core.setFailed(`❌ Erro na API do GitHub Models: ${response.status} - ${errorText}`);
              }
              return;
            }

            const data = await response.json();
            const review = data.choices?.[0]?.message?.content;

            if (!review) {
              core.warning('⚠️ Nenhuma revisão foi gerada pela IA.');
              return;
            }

            console.log('✅ Revisão gerada com sucesso!');

            // Remove comentários anteriores
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            for (const comment of comments) {
              if (comment.body?.startsWith('## 🤖 AI Code Review')) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: comment.id,
                });
              }
            }

            // Posta o novo comentário
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## 🤖 AI Code Review\n\n${review}\n\n---\n*Revisão gerada automaticamente via GitHub Models.*`
            });

            console.log('✅ Comentário de revisão postado com sucesso!');