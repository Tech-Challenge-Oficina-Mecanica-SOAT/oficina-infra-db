name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: AI Code Review
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          script: |
            const MAX_DIFF_LENGTH = 12000;

            // Busca os arquivos alterados no PR
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            });

            const diffContent = files
              .filter(f => f.patch && f.status !== 'removed')
              .map(f => `### ${f.filename}\n\`\`\`diff\n${f.patch}\n\`\`\``)
              .join('\n\n');

            if (!diffContent.trim()) {
              console.log('Nenhuma alteração de código para revisar.');
              return;
            }

            const truncatedDiff = diffContent.length > MAX_DIFF_LENGTH
              ? diffContent.slice(0, MAX_DIFF_LENGTH) + '\n\n*(diff truncado por tamanho)*'
              : diffContent;

            // NOVO: Endpoint correto do GitHub Models
            const response = await fetch('https://models.github.ai/catalog/models', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${process.env.GH_TOKEN}`,
                'api-version': '2024-02-15-preview'
              },
              body: JSON.stringify({
                model: 'gpt-4o-mini',
                messages: [
                  {
                    role: 'system',
                    content: `Você é um revisor de código experiente em Terraform, AWS e infraestrutura como código (IaC). Revise o diff do PR abaixo e forneça feedback construtivo em Português (Brasil).

                    Regras obrigatórias:
                    - Cite APENAS os tópicos onde houver problemas reais.
                    - NÃO escreva frases do tipo "não se aplica" ou "nenhum problema encontrado neste tópico".
                    - Se não houver NENHUM problema, responda apenas com: "✅ Esse PR não contém nenhum ponto de atenção relevante. Ótima implementação!"
                    - Seja direto e objetivo.

                    Tópicos a avaliar (somente se houver problemas):

                    1. Segurança (AWS)
                    2. Boas práticas de Terraform
                    3. Consistência com a arquitetura do projeto
                    4. Restrições do ambiente AWS Academy
                    5. Possíveis bugs`,
                  },
                  {
                    role: 'user',
                    content: `Revise este pull request:\n\n${truncatedDiff}`,
                  },
                ],
                max_tokens: 1500,
                temperature: 0.3,
              }),
            });

            // Se falhar, tenta sem o /v1/
            if (!response.ok && response.status === 404) {
              console.log('⚠️ Tentando endpoint alternativo...');
              
              const response2 = await fetch('https://models.inference.ai.azure.com/chat/completions', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'Authorization': `Bearer ${process.env.GH_TOKEN}`,
                },
                body: JSON.stringify({
                  model: 'gpt-4o-mini',
                  messages: [
                    {
                      role: 'system',
                      content: `Você é um revisor de código experiente em Terraform, AWS e infraestrutura como código (IaC). Revise o diff do PR abaixo e forneça feedback construtivo em Português (Brasil).

                      Regras obrigatórias:
                      - Cite APENAS os tópicos onde houver problemas reais.
                      - NÃO escreva frases do tipo "não se aplica" ou "nenhum problema encontrado neste tópico".
                      - Se não houver NENHUM problema, responda apenas com: "✅ Esse PR não contém nenhum ponto de atenção relevante. Ótima implementação!"
                      - Seja direto e objetivo.

                      Tópicos a avaliar (somente se houver problemas):

                      1. Segurança (AWS)
                      2. Boas práticas de Terraform
                      3. Consistência com a arquitetura do projeto
                      4. Restrições do ambiente AWS Academy
                      5. Possíveis bugs`,
                    },
                    {
                      role: 'user',
                      content: `Revise este pull request:\n\n${truncatedDiff}`,
                    },
                  ],
                  max_tokens: 1500,
                  temperature: 0.3,
                }),
              });

              if (!response2.ok) {
                const errorText2 = await response2.text();
                core.setFailed(`Erro na API do GitHub Models: ${response2.status} - ${errorText2}`);
                return;
              }

              const data2 = await response2.json();
              const review2 = data2.choices?.[0]?.message?.content;

              if (!review2) {
                core.warning('Nenhuma revisão foi gerada.');
                return;
              }

              await postReview(review2);
              return;
            }

            if (!response.ok) {
              const errorText = await response.text();
              core.setFailed(`Erro na API do GitHub Models: ${response.status} - ${errorText}`);
              return;
            }

            const data = await response.json();
            const review = data.choices?.[0]?.message?.content;

            if (!review) {
              core.warning('Nenhuma revisão foi gerada.');
              return;
            }

            // Função para postar a revisão
            async function postReview(reviewText) {
              // Remove comentários anteriores
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });

              for (const comment of comments) {
                if (comment.body?.startsWith('## 🤖 AI Code Review')) {
                  await github.rest.issues.deleteComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    comment_id: comment.id,
                  });
                }
              }

              // Posta o novo comentário
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `## 🤖 AI Code Review\n\n${reviewText}\n\n---\n*Revisão gerada automaticamente via GitHub Models.*`,
              });
            }

            await postReview(review);
            console.log('✅ Comentário de revisão postado com sucesso!');